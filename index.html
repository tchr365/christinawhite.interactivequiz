<html>
    <head>
<link rel="stylesheet" href="style.css">
    </head>

    <body bgcolor="FA8FBB">
 <div align="center">
<img src="math1.jpg" width="300">
<div align="left">

<table border="0" cellspacing="0" cellpadding="0" width="100%">
  <tr>
    <td width="50%"><form method="POST" name="instantquiz">
      <table border="0" width="100%" cellspacing="0" cellpadding="0">
        <div align="center"><h1><strong>5th Grade Math Review Quiz</strong></h1>
        <tr>
          <td width="100%"><div align="center"><center><p><textarea class="question-box" rows="10" name="thequestion"
          cols="69" wrap="virtual"></textarea></td>
        </tr>
        <tr align="center">
         <td width="50%"><div align="center"><center><p><strong><br><br><span class="solution-label">Solution: </span></strong><input
          type="text" name="thesolution" size="35"></td>
        </tr>
        <tr align="center">
          <td width="100%"><div align="center"><center><p><strong><br><br><span class="response-label">Your response: </strong> <select
          name="theresponse" size="1" onChange="responses()">
            <option value="-----">----</option>
            <option value="a">a</option>
            <option value="b">b</option>
            <option value="c">c</option>
            <option value="d">d</option>
          </select> 
<input type="button" value="<< Back" name="B1" class="nav-button"
          onClick="if (whichone>1){whichone--;generatequestions()}"> <input type="button" 
          value="Next >>" name="B2" class="nav-button"
          onClick="if (whichone<=total){whichone++;generatequestions()}"><br><br><br>
          <small><a href="#" class="start-over-link" onClick="whichone=1;generatequestions();return false">Start Over</a> </small><hr><p align="center"><font face="arial" size="-2">This free quiz script provided by</font><br> <font face="arial, helvetica" size="-2"><a href="http://javascriptkit.com">JavaScript Kit</a></font></p></td>
        </tr>
      </table>
    </form>
    </td>
  </tr>
</table>
</div>

<script src="pop.js">

</script>
<script language="JavaScript1.1">
var whichone=1
var tempmn=document.instantquiz.thequestion

function generatequestions(){
document.instantquiz.theresponse.selectedIndex=0
document.instantquiz.thesolution.value=''

if (whichone>=total+1)
tempmn.value="Congratulations! You've completed the 5th grade math review quiz."
else{
tempmn.value=whichone+")  "+question[whichone]+"\n\n"+"a)  "+eval('choice'+whichone+'[1]')+"\n\n"+"b)  "+eval('choice'+whichone+'[2]')+"\n\n"+"c)  "+eval('choice'+whichone+'[3]')+"\n\n"+"d)  "+eval('choice'+whichone+'[4]')
}
}

function responses(){
var temp2=document.instantquiz.theresponse
var temp3=temp2.options[temp2.selectedIndex].text
if (temp3!=solution[whichone]&&temp2.selectedIndex!=0)
document.instantquiz.thesolution.value="Solid effort, but the correct answer is "+solution[whichone]
else if(temp2.selectedIndex!=0)
document.instantquiz.thesolution.value=compliments[Math.round(Math.random()*compliments.length-1)]
}

generatequestions()
</script>

</html>
